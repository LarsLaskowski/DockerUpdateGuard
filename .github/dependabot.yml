# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Bundle all NuGet updates into a single pull request instead of
    # opening a separate PR per package.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    # The next major of these belongs to the next .NET (Microsoft.AspNetCore.Mvc.Testing and
    # Microsoft.EntityFrameworkCore 11.0.0 target net11.0 only; Microsoft.Extensions.* 11.0.0 would restore into a
    # net10.0 project too): it comes with the change of the target framework, not alone.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]

  # The SDK of global.json: patch and feature bands as they are released; the next major (10 to 11) comes with the
  # change of the target framework, never alone.
  - package-ecosystem: dotnet-sdk
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # The images of src/DockerUpdateGuard/Dockerfile (defaults of its build arguments). The .NET images move to the
  # next major with the target framework, as the SDK does.
  - package-ecosystem: docker
    directory: "/src/DockerUpdateGuard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "mcr.microsoft.com/dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
